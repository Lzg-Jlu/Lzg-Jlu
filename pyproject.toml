[project]
name = "avl-drive-approx"
version = "0.1.0"
description = "Open approximate algorithms for AVL-DRIVE-style drivability methodology benchmarking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
